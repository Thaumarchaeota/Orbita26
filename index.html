<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>起始页</title>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --text: #1a3a5c;
      --time: #1565c0;
      --muted: #6b8caf;
      --surface: rgba(255,255,255,.55);
      --surface-active: rgba(255,255,255,.75);
      --border: rgba(21,101,192,.14);
      --border-active: rgba(21,101,192,.32);
      --shadow: rgba(21,101,192,.08);
      --input-ph: #8fa8be;
      --btn-bg: rgba(21,101,192,.08);
      --btn-hover: #1565c0;
      --focus: rgba(21,101,192,.4);
      --toggle-bg: rgba(255,255,255,.5);
      --toggle-color: #1565c0;
      --github: #24292f;
      --ease: cubic-bezier(.4, 0, .2, 1);
      --spring: cubic-bezier(.34, 1.2, .64, 1);
    }
    [data-theme="dark"] {
      --text: rgba(255,255,255,.92);
      --time: #e0e0e8;
      --muted: rgba(255,255,255,.45);
      --surface: rgba(255,255,255,.06);
      --surface-active: rgba(255,255,255,.14);
      --border: rgba(255,255,255,.08);
      --border-active: rgba(255,255,255,.2);
      --shadow: rgba(0,0,0,.2);
      --input-ph: rgba(255,255,255,.28);
      --btn-bg: rgba(255,255,255,.1);
      --btn-hover: rgba(42,171,238,.6);
      --focus: rgba(42,171,238,.45);
      --toggle-bg: rgba(255,255,255,.08);
      --toggle-color: rgba(255,255,255,.7);
      --github: #e6edf3;
    }
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      transition: opacity .6s var(--ease);
    }
    .bg-light { background: linear-gradient(160deg, #c8d9ea, #d8e4ef 50%, #dce6f0); opacity: 1; }
    .bg-dark { background: radial-gradient(ellipse at 50% 0%, #1a2744, #090b10 70%); opacity: 0; }
    [data-theme="dark"] .bg-light { opacity: 0; }
    [data-theme="dark"] .bg-dark { opacity: 1; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      padding: 32px;
      transition: color .5s var(--ease);
    }
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--toggle-bg);
      color: var(--toggle-color);
      cursor: pointer;
      transition: background .5s var(--ease), border-color .5s var(--ease), color .5s var(--ease), transform .2s var(--spring);
    }
    .theme-toggle:hover { transform: scale(1.08); }
    .theme-toggle:active { transform: scale(.95); }
    .theme-toggle svg {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      margin: -9px 0 0 -9px;
      transition: opacity .45s var(--ease), transform .45s var(--spring);
    }
    .icon-moon { opacity: 1; transform: rotate(0); }
    .icon-sun { opacity: 0; transform: rotate(-60deg) scale(.6); }
    [data-theme="dark"] .icon-moon { opacity: 0; transform: rotate(60deg) scale(.6); }
    [data-theme="dark"] .icon-sun { opacity: 1; transform: rotate(0); }
    .main { width: 100%; max-width: 600px; text-align: center; }
    .time {
      font-family: Ubuntu, sans-serif;
      font-size: 72px;
      font-weight: 300;
      line-height: 1;
      margin-bottom: 8px;
      color: var(--time);
      transition: color .5s var(--ease);
    }
    .date {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 36px;
      transition: color .5s var(--ease);
    }
    .engines-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 14px;
    }
    .engine-indicator {
      position: absolute;
      top: 0;
      left: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--surface-active);
      border: 1px solid var(--border-active);
      box-shadow: 0 2px 12px var(--shadow);
      transition: transform .4s var(--spring), background .5s var(--ease), border-color .5s var(--ease), box-shadow .5s var(--ease);
      pointer-events: none;
    }
    .engines {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 380px;
      position: relative;
      z-index: 1;
    }
    .engines button {
      width: 40px;
      height: 40px;
      border: 1px solid transparent;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      opacity: .4;
      transition: opacity .3s var(--ease), transform .3s var(--spring);
    }
    .engines button:hover { opacity: .65; transform: scale(1.06); }
    .engines button.active { opacity: 1; transform: scale(1.02); }
    .engines svg { width: 20px; height: 20px; transition: transform .3s var(--spring); }
    .engines button.active svg { transform: scale(1.08); }
    .engines button[data-id="github"] svg path { fill: var(--github); transition: fill .5s var(--ease); }
    .search-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .search-bar {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      height: 50px;
      padding: 0 6px 0 20px;
      background: var(--surface-active);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 25px;
      box-shadow: 0 4px 20px var(--shadow);
      transition: background .5s var(--ease), border-color .5s var(--ease), box-shadow .5s var(--ease);
    }
    .search-bar:focus-within { border-color: var(--focus); }
    .search-bar input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      transition: color .5s var(--ease), opacity .25s var(--ease);
    }
    .search-bar input.fade { opacity: 0; }
    .search-bar input::placeholder { color: var(--input-ph); transition: color .5s var(--ease); }
    .search-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: var(--btn-bg);
      color: var(--toggle-color);
      cursor: pointer;
      transition: background .5s var(--ease), color .5s var(--ease), transform .2s var(--spring);
    }
    .search-btn:hover { background: var(--btn-hover); color: #fff; transform: scale(1.06); }
    .search-btn svg { width: 18px; height: 18px; }
    .v2ray-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 50px;
      height: 50px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface-active);
      box-shadow: 0 4px 20px var(--shadow);
      color: #3b82f6;
      text-decoration: none;
      transition: background .5s var(--ease), border-color .5s var(--ease), box-shadow .5s var(--ease), transform .2s var(--spring);
    }
    .v2ray-btn:hover { transform: scale(1.06); border-color: var(--border-active); }
    .v2ray-btn:active { transform: scale(.95); }
    .v2ray-btn svg { width: 22px; height: 22px; }
  </style>
</head>
<body>
  <div class="bg bg-light"></div>
  <div class="bg bg-dark"></div>
  <button class="theme-toggle" id="themeToggle" title="切换主题">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
  <div class="main">
    <div class="time" id="time"></div>
    <div class="date" id="date"></div>
    <div class="engines-wrap">
      <div class="engine-indicator" id="indicator"></div>
      <div class="engines" id="engines"></div>
    </div>
    <div class="search-row">
      <form class="search-bar" id="searchForm">
        <input type="text" id="searchInput" autofocus>
        <button type="submit" class="search-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        </button>
      </form>
      <a class="v2ray-btn" id="v2rayBtn" href="v2rayn://open" title="启动 v2rayN">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </a>
    </div>
  </div>
  <script>
    document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || "light");
    document.getElementById("themeToggle").onclick = () => {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
    };
    const ENGINES = [
      { id: "bing", name: "Bing", icon: `<svg viewBox="0 0 24 24"><path fill="#008373" d="M5 3v18l5.2-3V6.2L5 3z"/><path fill="#00BCF2" d="M10.2 6.2v11.8L19 21V3l-8.8 3.2z"/></svg>`, url: q => `https://www.bing.com/search?q=${q}` },
      { id: "google", name: "Google", icon: `<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>`, url: q => `https://www.google.com/search?q=${q}` },
      { id: "scholar", name: "Scholar", icon: `<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/><path fill="#669DF6" d="M12 3L5 6.82 12 10.6l7-3.78L12 3z"/></svg>`, url: q => `https://scholar.google.com/scholar?q=${q}` },
      { id: "pubmed", name: "PubMed", icon: `<svg viewBox="0 0 24 24"><path fill="#20558a" d="M3 5a2 2 0 0 1 2-2h6v18H5a2 2 0 0 1-2-2V5z"/><path fill="#3273a8" d="M11 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-8V3z"/><path fill="#fff" fill-opacity=".9" d="M5.5 7.5h4v1h-4v-1zm0 2.5h4v1h-4v-1zm0 2.5h3v1h-3v-1zm7-5h6v1h-6v-1zm0 2.5h6v1h-6v-1zm0 2.5h5v1h-5v-1z"/></svg>`, url: q => `https://pubmed.ncbi.nlm.nih.gov/?term=${q}` },
      { id: "github", name: "GitHub", icon: `<svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.604-3.369-1.341-3.369-1.341-.454-1.155-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>`, url: q => `https://github.com/search?q=${q}&type=repositories` },
      { id: "baidu", name: "百度", icon: `<svg viewBox="0 0 24 24"><circle fill="#306CFF" cx="7.8" cy="9.2" r="2.3"/><circle fill="#306CFF" cx="12" cy="7.2" r="2.6"/><circle fill="#306CFF" cx="16.2" cy="9.2" r="2.3"/><ellipse fill="#306CFF" cx="12" cy="15.8" rx="5.2" ry="4.5"/></svg>`, url: q => `https://www.baidu.com/s?wd=${q}` }
    ];
    let current = ENGINES.find(e => e.id === localStorage.getItem("engine")) || ENGINES[1];
    const input = document.getElementById("searchInput");
    const indicator = document.getElementById("indicator");
    const enc = encodeURIComponent;
    const moveIndicator = btn => {
      if (!btn) return;
      indicator.style.transform = `translate(${btn.offsetLeft}px, ${btn.offsetTop}px)`;
    };
    const setPlaceholder = () => {
      input.classList.add("fade");
      setTimeout(() => {
        input.placeholder = `在 ${current.name} 中搜索`;
        input.classList.remove("fade");
      }, 150);
    };
    document.getElementById("engines").innerHTML = ENGINES.map(e =>
      `<button type="button" data-id="${e.id}" class="${e.id === current.id ? "active" : ""}" title="${e.name}">${e.icon}</button>`
    ).join("");
    const activeBtn = document.querySelector(`.engines button[data-id="${current.id}"]`);
    requestAnimationFrame(() => moveIndicator(activeBtn));
    window.addEventListener("resize", () => moveIndicator(document.querySelector(".engines button.active")));
    document.getElementById("engines").onclick = e => {
      const btn = e.target.closest("button");
      if (!btn || btn.classList.contains("active")) return;
      current = ENGINES.find(x => x.id === btn.dataset.id);
      localStorage.setItem("engine", current.id);
      document.querySelectorAll(".engines button").forEach(b => b.classList.toggle("active", b === btn));
      moveIndicator(btn);
      setPlaceholder();
      input.focus();
    };
    document.getElementById("searchForm").onsubmit = e => {
      e.preventDefault();
      const v = input.value.trim();
      if (!v) return;
      location.href = /^https?:\/\//.test(v) || /^[\w-]+\.[\w.-]+/.test(v)
        ? (v.startsWith("http") ? v : "https://" + v)
        : current.url(enc(v));
    };
    const tick = () => {
      const n = new Date();
      document.getElementById("time").textContent = n.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
      document.getElementById("date").textContent = n.toLocaleDateString("zh-CN", { weekday: "long", month: "long", day: "numeric" });
    };
    tick();
    setInterval(tick, 1000);
    input.placeholder = `在 ${current.name} 中搜索`;
    document.getElementById("v2rayBtn").onclick = e => {
      if (location.protocol === "file:") {
        e.preventDefault();
        alert("请用 start.bat 打开起始页，否则浏览器会拦截启动 v2rayN。");
      }
    };
  </script>
</body>
</html>
