[package]
name = "powersync-windows-probe"
version = "0.1.0"
edition = "2024"
publish = false

# Deliberately independent from the application's SQLite dependency graph.
[workspace]

[dependencies]
anyhow = "1"
powersync = { version = "=0.1.1", features = ["tokio", "reqwest"] }
reqwest = "0.13.2"
rusqlite = { version = "0.39.0", features = ["bundled", "backup"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
