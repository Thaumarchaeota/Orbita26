[package]
name = "orbita-sync"
version = "0.1.0"
edition = "2021"
description = "Orbita Journal/Health sync API service"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "orbita-sync"
path = "src/main.rs"

[[bin]]
name = "orbita-sync-tools"
path = "src/bin/tools.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
hmac = "0.12"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
jsonschema = { version = "0.26", default-features = false, features = ["resolve-file"] }
ryu = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[features]
default = []
